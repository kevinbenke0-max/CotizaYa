<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Admin - Control De Caja Ultra</title>
    <!-- Firebase SDK (v8 o similar como usas en tu proyecto) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
        }
        h1 {
            color: #00e676;
            text-align: center;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        .card {
            background-color: #1e1e1e;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        .info {
            line-height: 1.5;
        }
        .device-id {
            font-weight: bold;
            font-size: 1.1em;
            color: #29b6f6;
        }
        .status-active {
            color: #00e676;
            font-weight: bold;
        }
        .status-expired {
            color: #ff5252;
            font-weight: bold;
        }
        .btn {
            background-color: #00e676;
            color: #000;
            border: none;
            padding: 10px 15px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn:hover {
            background-color: #00c853;
        }
        .btn-block {
            background-color: #ff5252;
            color: #fff;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Panel Admin - Licencias</h1>
    <div id="lista-dispositivos">Cargando dispositivos registrados...</div>
</div>

<script>
    // 1. PEGA AQUÍ TU CONFIGURACIÓN DE FIREBASE (Tal cual la tienes en script.js)
    const firebaseConfig = {
        apiKey: "TU_API_KEY",
        authDomain: "TU_PROJECT_ID.firebaseapp.com",
        projectId: "TU_PROJECT_ID",
        storageBucket: "TU_PROJECT_ID.appspot.com",
        messagingSenderId: "TU_SENDER_ID",
        appId: "TU_APP_ID"
    };

    // Inicializar Firebase
    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.firestore();

    // 2. Escuchar en tiempo real los dispositivos cargados en la colección "licenses"
    db.collection("licenses").onSnapshot((snapshot) => {
        const contenedor = document.getElementById("lista-dispositivos");
        contenedor.innerHTML = "";

        if (snapshot.empty) {
            contenedor.innerHTML = "<p>No hay dispositivos registrados.</p>";
            return;
        }

        snapshot.forEach((doc) => {
            const data = doc.data();
            const deviceId = doc.id;
            const expirationDate = data.expirationDate || 0;
            const status = data.status || 'inactive';
            
            // Cálculo de días restantes
            const ahora = Date.now();
            const diferenciaMilisegundos = expirationDate - ahora;
            const diasRestantes = Math.ceil(diferenciaMilisegundos / (1000 * 60 * 60 * 24));
            
            const estaActivo = status === 'active' && diasRestantes > 0;
            const textoVencimiento = estaActivo 
                ? `Vence en: <b class="status-active">${diasRestantes} días</b>` 
                : `<b class="status-expired">Licencia Vencida / Inactiva</b>`;

            // Crear tarjeta para el dispositivo
            const card = document.createElement("div");
            card.className = "card";
            card.innerHTML = `
                <div class="info">
                    <div class="device-id">ID: ${deviceId}</div>
                    <div>Estado: <span>${status}</span></div>
                    <div>${textoVencimiento}</div>
                </div>
                <div>
                    <button class="btn" onclick="renovar30Dias('${deviceId}')">+ Renovación 30 Días</button>
                </div>
            `;
            contenedor.appendChild(card);
        });
    });

    // 3. Función para renovar 30 días exactos con un clic
    function renovar30Dias(deviceId) {
        const ahora = Date.now();
        const treintaDiasEnMilisegundos = 30 * 24 * 60 * 60 * 1000; // 30 días exactos
        const nuevaExpiracion = ahora + treintaDiasEnMilisegundos;

        db.collection("licenses").doc(deviceId).set({
            expirationDate: nuevaExpiracion,
            status: "active"
        }, { merge: true })
        .then(() => {
            alert(`¡Licencia de ${deviceId} renovada por 30 días con éxito!`);
        })
        .catch((error) => {
            alert("Error al renovar: " + error.message);
        });
    }
</script>

</body>
</html>
