<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel Admin - Cuentas y Suscripciones</title>
  <style>
    body {
      background-color: #121212;
      color: #fff;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
    }
    h1 {
      text-align: center;
      color: #00ff66;
      margin-bottom: 20px;
    }
    .search-container {
      max-width: 500px;
      margin: 0 auto 25px auto;
      padding: 0 10px;
    }
    .search-input {
      width: 100%;
      padding: 12px 15px;
      background: #1a1a1a;
      border: 1px solid #333;
      color: #fff;
      border-radius: 8px;
      font-size: 1rem;
      outline: none;
      box-sizing: border-box;
    }
    .search-input:focus {
      border-color: #00ff66;
    }
    .license-card {
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 10px;
      padding: 15px 20px;
      margin: 0 auto 15px auto;
      max-width: 500px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
    }
    .license-id {
      color: #00d2ff;
      font-size: 1.1rem;
      font-weight: bold;
      margin-bottom: 5px;
    }
    .status-active {
      color: #00ff66;
      font-weight: bold;
    }
    .status-inactive {
      color: #ff4444;
      font-weight: bold;
    }
    .btn-renew {
      background-color: #00ff66;
      color: #000;
      border: none;
      padding: 10px 15px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
      width: 100%;
      font-size: 0.95rem;
    }
    .btn-renew:hover {
      background-color: #00cc52;
    }
  </style>
</head>
<body>

  <h1>Panel Admin - Cuentas y Suscripciones</h1>

  <div class="search-container">
    <input type="text" id="searchInput" class="search-input" placeholder="🔍 Buscar por nombre de usuario (ej: kioscomaria)..." oninput="filtrarLicencias()">
  </div>

  <div id="licensesContainer">
    <p style="text-align: center; color: #888;">Cargando cuentas...</p>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyB4eg-yFaE9FQe9dB3WNeOj9JJwI...",
      authDomain: "control-caja-ultra.firebaseapp.com",
      projectId: "control-caja-ultra",
      storageBucket: "control-caja-ultra.appspot.com",
      messagingSenderId: "76362765432",
      appId: "1:76362765432:web:1e44c161254bec0..."
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.firestore();

    let todasLasCuentas = [];

    function cargarLicenciasAdmin() {
      db.collection("licenses").onSnapshot((snapshot) => {
        const container = document.getElementById('licensesContainer');
        container.innerHTML = '';
        todasLasCuentas = [];

        if (snapshot.empty) {
          container.innerHTML = `<p style="text-align: center; color: #888;">No hay cuentas registradas.</p>`;
          return;
        }

        const nowMs = new Date().getTime();

        snapshot.forEach((doc) => {
          const uid = doc.id;
          const data = doc.data();
          const username = data.username || "Sin usuario";
          const expireTime = data.expirationDate || 0;
          const diffMs = expireTime - nowMs;
          const daysLeft = Math.ceil(diffMs / (1000 * 60 * 60 * 24));
          const isActive = diffMs > 0;

          todasLasCuentas.push({
            uid,
            username: username.toLowerCase(),
            usernameDisplay: username,
            status: data.status || 'trial',
            isActive,
            daysLeft,
            expireTime
          });
        });

        renderizarLicencias(todasLasCuentas);
      });
    }

    function renderizarLicencias(cuentas) {
      const container = document.getElementById('licensesContainer');
      container.innerHTML = '';

      if (cuentas.length === 0) {
        container.innerHTML = `<p style="text-align: center; color: #888;">No se encontró ninguna cuenta con ese nombre.</p>`;
        return;
      }

      cuentas.forEach(acc => {
        const card = document.createElement('div');
        card.className = 'license-card';

        let statusHtml = '';
        if (acc.isActive) {
          statusHtml = `<span class="status-active">Vence en: ${acc.daysLeft} días</span>`;
        } else {
          statusHtml = `<span class="status-inactive">Suscripción Vencida / Inactiva</span>`;
        }

        card.innerHTML = `
          <div class="license-id">👤 Usuario: ${acc.usernameDisplay}</div>
          <div style="color: #ccc; margin: 5px 0;">Estado: <b>${acc.status}</b></div>
          <div style="margin-bottom: 10px;">${statusHtml}</div>
          <button class="btn-renew" onclick="renovarLicencia('${acc.uid}', '${acc.usernameDisplay}')">+ Renovación 30 Días</button>
        `;

        container.appendChild(card);
      });
    }

    function filtrarLicencias() {
      const query = document.getElementById('searchInput').value.trim().toLowerCase();
      const filtradas = todasLasCuentas.filter(acc => acc.username.includes(query));
      renderizarLicencias(filtradas);
    }

    window.renovarLicencia = async function(uid, username) {
      if (!confirm(`¿Deseas sumar 30 días de suscripción al usuario "${username}"?`)) return;

      try {
        const docRef = db.collection("licenses").doc(uid);
        const doc = await docRef.get();
        const nowMs = new Date().getTime();

        let baseTime = nowMs;
        if (doc.exists && doc.data().expirationDate > nowMs) {
          baseTime = doc.data().expirationDate;
        }

        const thirtyDaysMs = 30 * 24 * 60 * 60 * 1000;
        const newExpireTime = baseTime + thirtyDaysMs;

        await docRef.update({
          expirationDate: newExpireTime,
          status: 'active'
        });

        alert(`¡Suscripción de "${username}" renovada con éxito por 30 días!`);
      } catch (err) {
        console.error("Error al renovar suscripción:", err);
        alert("Hubo un error al renovar la suscripción.");
      }
    };

    document.addEventListener('DOMContentLoaded', cargarLicenciasAdmin);
  </script>
</body>
</html>
