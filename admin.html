<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel Admin - Licencias</title>
  <style>
    body {
      background-color: #121212;
      color: #fff;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
    }
    h1 {
      text-align: center;
      color: #00ff66;
      margin-bottom: 20px;
    }
    /* Estilo de la barra de búsqueda */
    .search-container {
      max-width: 500px;
      margin: 0 auto 25px auto;
      padding: 0 10px;
    }
    .search-input {
      width: 100%;
      padding: 12px 15px;
      background: #1a1a1a;
      border: 1px solid #333;
      color: #fff;
      border-radius: 8px;
      font-size: 1rem;
      outline: none;
      box-sizing: border-box;
    }
    .search-input:focus {
      border-color: #00ff66;
    }
    .license-card {
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 10px;
      padding: 15px 20px;
      margin: 0 auto 15px auto;
      max-width: 500px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
    }
    .license-id {
      color: #00d2ff;
      font-size: 1.1rem;
      font-weight: bold;
      margin-bottom: 5px;
    }
    .status-active {
      color: #00ff66;
      font-weight: bold;
    }
    .status-inactive {
      color: #ff4444;
      font-weight: bold;
    }
    .btn-renew {
      background-color: #00ff66;
      color: #000;
      border: none;
      padding: 10px 15px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
      width: 100%;
      font-size: 0.95rem;
    }
    .btn-renew:hover {
      background-color: #00cc52;
    }
  </style>
</head>
<body>

  <h1>Panel Admin - Licencias</h1>

  <!-- BARRA DE BÚSQUEDA POR ID -->
  <div class="search-container">
    <input type="text" id="searchInput" class="search-input" placeholder="🔍 Buscar licencia por ID (ej: DEV-4RLEE9G)..." oninput="filtrarLicencias()">
  </div>

  <!-- CONTENEDOR DE LAS TARJETAS DE LICENCIAS -->
  <div id="licensesContainer">
    <p style="text-align: center; color: #888;">Cargando licencias...</p>
  </div>

  <!-- SDK DE FIREBASE -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

  <script>
    // --- CONFIGURACIÓN DE FIREBASE ---
    const firebaseConfig = {
      apiKey: "AIzaSyB4eg-yFaE9FQe9dB3WNeOj9JJwI...",
      authDomain: "control-caja-ultra.firebaseapp.com",
      projectId: "control-caja-ultra",
      storageBucket: "control-caja-ultra.appspot.com",
      messagingSenderId: "76362765432",
      appId: "1:76362765432:web:1e44c161254bec0..."
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.firestore();

    let todasLasLicencias = [];

    // Cargar licencias desde Firestore en tiempo real
    function cargarLicenciasAdmin() {
      db.collection("licenses").onSnapshot((snapshot) => {
        const container = document.getElementById('licensesContainer');
        container.innerHTML = '';
        todasLasLicencias = [];

        if (snapshot.empty) {
          container.innerHTML = `<p style="text-align: center; color: #888;">No hay licencias registradas.</p>`;
          return;
        }

        const nowMs = new Date().getTime();

        snapshot.forEach((doc) => {
          const id = doc.id;
          const data = doc.data();
          const expireTime = data.expirationDate || 0;
          const diffMs = expireTime - nowMs;
          const daysLeft = Math.ceil(diffMs / (1000 * 60 * 60 * 24));
          const isActive = diffMs > 0;

          todasLasLicencias.push({
            id,
            status: data.status || 'trial',
            isActive,
            daysLeft,
            expireTime
          });
        });

        renderizarLicencias(todasLasLicencias);
      });
    }

    // Renderizar tarjetas en pantalla
    function renderizarLicencias(licencias) {
      const container = document.getElementById('licensesContainer');
      container.innerHTML = '';

      if (licencias.length === 0) {
        container.innerHTML = `<p style="text-align: center; color: #888;">No se encontró ninguna licencia con ese ID.</p>`;
        return;
      }

      licencias.forEach(lic => {
        const card = document.createElement('div');
        card.className = 'license-card';
        card.setAttribute('data-id', lic.id.toLowerCase());

        let statusHtml = '';
        if (lic.isActive) {
          statusHtml = `<span class="status-active">Vence en: ${lic.daysLeft} días</span>`;
        } else {
          statusHtml = `<span class="status-inactive">Licencia Vencida / Inactiva</span>`;
        }

        card.innerHTML = `
          <div class="license-id">ID: ${lic.id}</div>
          <div style="color: #ccc; margin: 5px 0;">Estado: ${lic.status}</div>
          <div style="margin-bottom: 10px;">${statusHtml}</div>
          <button class="btn-renew" onclick="renovarLicencia('${lic.id}')">+ Renovación 30 Días</button>
        `;

        container.appendChild(card);
      });
    }

    // Filtrar licencias en tiempo real al escribir en el buscador
    function filtrarLicencias() {
      const query = document.getElementById('searchInput').value.trim().toLowerCase();
      const filtradas = todasLasLicencias.filter(lic => lic.id.toLowerCase().includes(query));
      renderizarLicencias(filtradas);
    }

    // Función para renovar licencia por 30 días más
    window.renovarLicencia = async function(id) {
      if (!confirm(`¿Deseas sumar 30 días de suscripción al dispositivo ${id}?`)) return;

      try {
        const docRef = db.collection("licenses").doc(id);
        const doc = await docRef.get();
        const nowMs = new Date().getTime();

        let baseTime = nowMs;
        if (doc.exists && doc.data().expirationDate > nowMs) {
          baseTime = doc.data().expirationDate; // Si aún le queda tiempo, se le suma desde el vencimiento actual
        }

        const thirtyDaysMs = 30 * 24 * 60 * 60 * 1000;
        const newExpireTime = baseTime + thirtyDaysMs;

        await docRef.update({
          expirationDate: newExpireTime,
          status: 'active'
        });

        alert(`¡Licencia ${id} renovada con éxito por 30 días!`);
      } catch (err) {
        console.error("Error al renovar licencia:", err);
        alert("Hubo un error al renovar la licencia.");
      }
    };

    // Iniciar carga al abrir la página
    document.addEventListener('DOMContentLoaded', cargarLicenciasAdmin);
  </script>
</body>
</html>
