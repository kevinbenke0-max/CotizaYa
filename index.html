<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ControlCaja - Cierre Diario de Caja</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="container">
    <header>
      <h1>💰 ControlCaja Pro</h1>
      <p>Gestión rápida de ingresos, gastos y cierres diarios</p>
    </header>

    <main class="app-card">
      <!-- Resumen del Día Actual -->
      <section class="summary-box">
        <div class="summary-card">
          <span>Ingresos (+)</span>
          <strong id="lblTotalIncome" class="text-success">$0</strong>
        </div>
        <div class="summary-card">
          <span>Gastos (-)</span>
          <strong id="lblTotalExpense" class="text-danger">$0</strong>
        </div>
        <div class="summary-card total-balance">
          <span>Caja Actual</span>
          <strong id="lblNetBalance">$0</strong>
        </div>
      </section>

      <!-- Formulario de Movimiento -->
      <section class="section">
        <h3>Registrar Movimiento de Hoy</h3>
        <div class="form-group">
          <label for="movDesc">Descripción / Concepto</label>
          <input type="text" id="movDesc" placeholder="Ej: Venta de mercadería / Proveedor">
        </div>
        
        <div class="form-row">
          <div class="form-group">
            <label for="movAmount">Monto ($)</label>
            <input type="number" id="movAmount" placeholder="0" min="0">
          </div>
          <div class="form-group">
            <label for="movType">Tipo</label>
            <select id="movType">
              <option value="income">➕ Ingreso</option>
              <option value="expense">➖ Gasto</option>
            </select>
          </div>
        </div>

        <button id="btnAddMov" class="btn btn-primary">+ Registrar Movimiento</button>
      </section>

      <!-- Movimientos de Hoy -->
      <section class="section">
        <div class="history-header">
          <h3>📋 Movimientos de Hoy</h3>
          <button id="btnCloseDay" class="btn btn-warning-soft">🔒 Cerrar Día y Guardar</button>
        </div>
        <table class="mov-table">
          <thead>
            <tr>
              <th>Concepto</th>
              <th>Tipo</th>
              <th style="text-align: right;">Monto</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="movList">
            <!-- Movimientos dinámicos -->
          </tbody>
        </table>
      </section>

      <!-- Historial de Cierres Anteriores -->
      <section class="section history-section">
        <div class="history-header">
          <h3>📅 Historial de Cierres Anteriores</h3>
          <button id="btnClearHistory" class="btn btn-danger-soft">Borrar Historial</button>
        </div>
        <table class="mov-table">
          <thead>
            <tr>
              <th>Fecha</th>
              <th>Ingresos / Gastos</th>
              <th style="text-align: right;">Neto</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="closedDaysList">
            <!-- Cierres guardados -->
          </tbody>
        </table>
      </section>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
